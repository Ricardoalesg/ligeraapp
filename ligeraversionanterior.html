<style>
:root{--bg:#F1F6F8;--card:#fff;--ink:#13283B;--muted:#5D6E7E;--line:#DCE6EC;--brand:#1A8A9C;--brand-2:#5CC4D2;--soft:#E3F4F7;--accent:#FF6F4F;--accent-d:#E85636;--good:#22A06B;--warn:#F5A524;--bad:#E5484D;--r:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
input{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 24px}
.fade{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
header.bar{position:sticky;top:0;z-index:10;background:rgba(241,246,248,.92);backdrop-filter:blur(8px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;letter-spacing:-.4px}.logo b{color:var(--brand)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--card);border:1px solid var(--line)}
h1{font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
h2{font-size:21px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
h3{font-size:16px;font-weight:800}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.mt{margin-top:14px}.mt2{margin-top:24px}.mb{margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.hero{background:linear-gradient(135deg,#1A8A9C,#3FB0C1);color:#fff;border:0;position:relative;overflow:hidden}
.hero .muted{color:rgba(255,255,255,.85)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--brand)}
.hero .pill{background:rgba(255,255,255,.2);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:#fff;font-weight:800;font-size:17px;padding:16px;border-radius:999px;box-shadow:0 4px 0 var(--accent-d);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.white{background:#fff;color:var(--brand);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;align-items:center}
.ex-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ex{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;width:100%}
.ex img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#fff;flex:none;border:1px solid var(--line)}
.ex .nm{font-weight:700;font-size:15px}.ex .tm{font-size:12.5px;color:var(--muted);margin-top:2px}
.ex .n{margin-left:auto;font-size:12px;font-weight:800;color:var(--brand);background:var(--soft);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.tip{display:flex;gap:12px;background:#FFF7E8;border:1px solid #F7E2B8;border-radius:16px;padding:14px;font-size:14.5px;line-height:1.5}
.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.dot{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.18);color:#fff}
.dot.done{background:#fff;color:var(--brand)}.dot.today{outline:2px solid #fff;outline-offset:2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tab span{font-size:21px;filter:grayscale(1);opacity:.6}
.tab.on{color:var(--brand)}.tab.on span{filter:none;opacity:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}
.cday{aspect-ratio:1;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;position:relative}
.cday small{font-size:9px;font-weight:600;color:var(--muted)}
.cday.done{background:var(--brand);color:#fff;border-color:var(--brand)}.cday.done small{color:rgba(255,255,255,.8)}
.cday.cur{border:2px solid var(--accent)}
.cday.lock{opacity:.45}
.cday.rest:not(.done){background:#FFF7E8}
.wk-title{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800;color:var(--brand)}.stat small{font-size:12px;color:var(--muted)}
.lesson{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;text-align:left}
.lesson .ic{width:44px;height:44px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.lesson .nm{font-weight:700;font-size:15px}.lesson .ds{font-size:12.5px;color:var(--muted);margin-top:2px}
.lesson .read{margin-left:auto;font-size:18px;color:var(--good)}
.article p{font-size:16px;line-height:1.65;margin-top:12px;color:#26394B}
.article ul{margin:10px 0 0 20px}.article li{font-size:15.5px;line-height:1.6;margin-top:6px;color:#26394B}
.article .key{background:var(--soft);border-radius:14px;padding:14px;margin-top:16px;font-size:15px;line-height:1.55}
.alert{background:#FDECEC;border:1px solid #F6C9CA;border-radius:14px;padding:14px;font-size:14.5px;line-height:1.55;margin-top:14px}
/* options */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:15px 16px;font-size:16px;font-weight:600;text-align:left;width:100%}
.opt.sel{border-color:var(--brand);background:var(--soft)}
.opt .em{font-size:24px;width:30px;text-align:center}
.opt .chk{margin-left:auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.opt.sel .chk{background:var(--brand);border-color:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.input{width:100%;font-size:18px;padding:16px;border-radius:14px;border:2px solid var(--line);background:#fff;outline:none;margin-top:18px}
.input:focus{border-color:var(--brand)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5;margin-top:16px;text-align:left}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--brand)}
/* player */
.player{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.player .top{max-width:560px;width:100%;margin:0 auto;display:flex;align-items:center;gap:10px}
.segs{flex:1;display:flex;gap:3px}.segs i{flex:1;height:5px;border-radius:5px;background:var(--line)}.segs i.d{background:var(--brand)}.segs i.c{background:var(--brand-2)}
.player .body{flex:1;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto}
.player .art{width:min(78vw,330px);aspect-ratio:1;border-radius:24px;object-fit:cover;border:1px solid var(--line)}
.player .label{font-size:12px;font-weight:800;letter-spacing:1.4px;color:var(--brand);text-transform:uppercase;margin-top:14px}
.player .name{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.3px}
.player .cue{font-size:15.5px;line-height:1.5;color:#33475B;margin-top:8px;min-height:46px;max-width:420px}
.timer{position:relative;width:118px;height:118px;margin-top:12px}
.timer svg{transform:rotate(-90deg)}
.timer span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.ctrl{max-width:560px;width:100%;margin:12px auto 0;display:grid;grid-template-columns:64px 1fr 64px;gap:12px;align-items:center}
.round{height:64px;border-radius:50%;background:var(--bg);font-size:22px;display:flex;align-items:center;justify-content:center}
.prep{background:var(--soft)}
/* checkin */
.scale5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.scale5 button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 0;font-size:22px}
.scale5 button.sel{border-color:var(--brand);background:var(--soft)}
.ci-q{margin-top:18px;font-weight:700;font-size:15px}
.ci-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.confetti{font-size:64px;animation:pop .6s ease}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.modal{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.notice{display:flex;gap:12px;background:#FFF4E5;border:1px solid #F5D19A;border-radius:16px;padding:14px;font-size:14px;line-height:1.5;margin-bottom:16px}
.notice b{display:block;margin-bottom:2px}
.notice button{color:#9A5B00;font-weight:700;font-size:13px;margin-top:8px;text-decoration:underline}
.btn.white.sm{font-size:15px;padding:12px;margin-top:10px;background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.7);box-shadow:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:14px;align-items:center;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);width:min(92vw,420px);animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.toast button{color:#7FE0EC;font-weight:800;margin-left:auto;white-space:nowrap}
.linkbtn{display:block;width:100%;text-align:center;color:#fff;font-weight:700;font-size:14px;margin-top:12px;text-decoration:underline;opacity:.95}
.disc{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;margin-top:26px}
.toggle{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--brand)}.toggle.on:after{left:23px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-weight:600;gap:12px}
.set-row:last-child{border:0}
</style>
</head>

  ingles:{img:5,name:"Bombeo de ingles",secs:45,phase:"lymph",

    why:"Las ingles son la “puerta de salida” del líquido de tus piernas. Si esta zona se mueve, las piernas drenan mejor."},

const LESSONS=[
 {id:"fascia",ic:"🕸️",t:"Qué es la fascia y por qué se pone rígida",d:"La malla que envuelve tus músculos",body:`<p>La fascia es un tejido delgado y elástico que envuelve cada músculo, órgano y vaso de tu cuerpo, como una malla continua de pies a cabeza.</p><p>Cuando está hidratada y en movimiento, se desliza con facilidad. Pero el sedentarismo, las horas sentada, el estrés sostenido y la tensión muscular hacen que pierda elasticidad y se “pegue”.</p><p>Una fascia rígida se siente como tirantez, cuerpo pesado y poca movilidad. Como los vasos linfáticos pasan entre esas capas, el movimiento de líquidos también se vuelve más lento.</p><div class="key">💡 <b>La clave:</b> la fascia responde al movimiento suave, frecuente y a la hidratación. No necesitas forzar: necesitas constancia.</div>`},
 {id:"linfa",ic:"💧",t:"Tu sistema linfático: un drenaje sin bomba",d:"Por qué el movimiento lo es todo",body:`<p>Tu sistema linfático es una red de vasos y ganglios que recoge el líquido que sale de los tejidos y lo devuelve a la sangre. También es parte de tus defensas.</p><p>A diferencia de la sangre, que tiene al corazón, la linfa <b>no tiene una bomba propia</b>. Se mueve gracias a:</p><ul><li>La contracción de tus músculos, sobre todo las pantorrillas.</li><li>La respiración profunda con el diafragma.</li><li>La gravedad, cuando elevas las piernas.</li><li>El masaje suave sobre la piel.</li></ul><p>Por eso, cuando pasas el día quieta, el líquido tiende a acumularse en tobillos y piernas, y al final del día las sientes pesadas.</p><div class="key">💡 Cada ejercicio de tu plan activa una de estas cuatro “bombas”.</div>`},
 {id:"cremas",ic:"🧴",t:"Por qué cremas y masajes no duran",d:"Síntoma vs. causa",body:`<p>Las cremas, las medias, los tés o un masaje pueden darte alivio por unas horas. El problema es que trabajan sobre el síntoma: el líquido que ya está acumulado.</p><p>Si la causa sigue ahí, que es poco movimiento, fascia rígida y un cuerpo en modo alerta, el líquido vuelve a acumularse al día siguiente.</p><p>Tu plan funciona distinto: en vez de una sesión fuerte de vez en cuando, haces <b>pocos minutos todos los días</b>. Así tu cuerpo aprende a drenar solo.</p><div class="key">💡 Las medias de compresión pueden seguir siendo útiles si te las indicó tu médico. El plan las complementa, no las reemplaza.</div>`},
 {id:"vago",ic:"🫁",t:"Respiración, nervio vago y modo alerta",d:"Cómo pasar de la alarma a la calma",body:`<p>Tu sistema nervioso tiene dos modos principales: <b>alerta</b> (lucha o huida) y <b>calma</b> (descanso y digestión). El nervio vago es el principal responsable de llevarte al modo calma.</p><p>Cuando vives con estrés sostenido, tu cuerpo pasa mucho tiempo en alerta: respiras corto, aprietas la mandíbula, tensas cuello y hombros, y descansas peor.</p><p>Una de las formas más simples de activar el modo calma es <b>exhalar más largo de lo que inhalas</b>. Por eso la respiración 4-6 y el tarareo están en tu plan todos los días.</p><div class="key">💡 Úsalo fuera de la rutina también: tres exhalaciones largas antes de una reunión, en el tráfico o antes de dormir.</div>`},
 {id:"sal",ic:"🧂",t:"Agua, sal y la hinchazón del final del día",d:"Pequeños cambios que suman",body:`<p>Parece contradictorio, pero tomar poca agua puede hacer que retengas más líquido. Tu cuerpo funciona mejor con una hidratación constante.</p><p>La sal en exceso hace que el cuerpo retenga agua. La mayor parte no viene del salero, sino de ultraprocesados, embutidos, snacks, salsas y comidas rápidas.</p><ul><li>Toma agua repartida durante el día.</li><li>Suma potasio: plátano, aguacate, espinaca, frijoles.</li><li>Reduce ultraprocesados, sobre todo en la cena.</li></ul><div class="key">💡 No se trata de una dieta estricta: con dos o tres cambios ya vas a notar diferencia.</div>`},
 {id:"pantorrilla",ic:"🦵",t:"El segundo corazón: tu pantorrilla",d:"El truco para trabajar sentada",body:`<p>Cada vez que caminas o mueves el tobillo, los músculos de la pantorrilla se contraen y aprietan las venas y vasos linfáticos, empujando líquido hacia arriba. Por eso se le llama el “segundo corazón”.</p><p>Si pasas horas sentada o de pie sin moverte, esa bomba se apaga y el líquido baja por gravedad.</p><ul><li>Cada hora: 10 elevaciones de talones o 30 segundos de bombeo de tobillos.</li><li>Sube escaleras cuando puedas.</li><li>Evita cruzar las piernas por mucho tiempo.</li></ul>`},
 {id:"sueno",ic:"🌙",t:"Dormir mejor para desinflamarte",d:"La noche también trabaja por ti",body:`<p>Mientras duermes, tu cuerpo repara tejidos y regula hormonas relacionadas con el estrés y el apetito. Dormir mal sostiene el modo alerta y hace que todo se sienta más pesado.</p><ul><li>Intenta acostarte a una hora parecida cada día.</li><li>Haz piernas en la pared o la respiración 4-6 antes de dormir.</li><li>Eleva un poco los pies con una almohada.</li><li>Cena más liviano y más temprano.</li></ul><div class="key">💡 Si te despiertas de madrugada, prueba tres exhalaciones largas en vez de mirar el celular.</div>`},

/* ============================================================
   RUTINA DEL DÍA
   ============================================================ */
function routine(day){
  const wk=WEEKS[Math.min(3,Math.floor((day-1)/7))];
  const scale=1+0.08*(wk.n-1);
  const budget=S.mins*60, short=S.mins<=7;
  const fixed=(id,secs)=>({id,secs});
  const mv=id=>({id,secs:Math.round(EX[id].secs*(short?0.75:1)*scale/5)*5});
  if(isRest(day)){
    return [fixed("respiracion",short?60:90),fixed("tobillos",60),fixed("pared",Math.max(120,budget-(short?60:90)-60-60)),fixed("tarareo",60)];
  }
  const opener=[fixed("respiracion",short?40:60),fixed("clavicula",short?30:45)];
  if(S.zones.includes("brazos")||(wk.n>=2&&!short)) opener.push(fixed("axilas",short?30:50));
  opener.push(fixed("ingles",short?30:45));
  const pared=fixed("pared",Math.max(60,Math.min(240,Math.round(budget*0.2/15)*15)));
  const closing=[pared,fixed(day%2?"tarareo":"rodillaspecho",short?40:45)];
  let used=[...opener,...closing].reduce((a,b)=>a+b.secs,0);
  const score=id=>(EX[id].zones||[]).filter(z=>S.zones.includes(z)).length;
  const pool=wk.pool.slice(); let seed=day*9301+49297;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const rotated=pool.map(id=>[rnd(),id]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  const ordered=rotated.filter(id=>score(id)>0).concat(rotated.filter(id=>score(id)===0));
  // alterna: zona prioritaria, luego variedad
  const moves=[];
  for(const id of ordered){ const it=mv(id); if(used+it.secs<=budget+10){ moves.push(it); used+=it.secs; } if(used>=budget-25) break; }
  // si sobra tiempo, alarga piernas en la pared y la respiración
  let extra=budget-used; if(extra>0){ const add=Math.min(extra,240-pared.secs); if(add>0){pared.secs+=Math.round(add/5)*5; extra-=add;} if(extra>0) opener[0].secs+=Math.round(Math.min(extra,60)/5)*5; }
  const standing=["marcha","talones","rebote","cadera","pantorrilla","punos","cuello","rostro"];
  moves.sort((a,b)=>(standing.includes(b.id)?1:0)-(standing.includes(a.id)?1:0));
  return [...opener,...moves,...closing];
}
const total=r=>r.reduce((a,b)=>a+b.secs,0);

let coolT=null;
function startCool(){AUTH.cool=60;clearInterval(coolT);coolT=setInterval(()=>{AUTH.cool--; const b=document.getElementById("resend"); if(b){b.disabled=AUTH.cool>0;b.textContent=AUTH.cool>0?`Reenviar código en ${AUTH.cool}s`:"Reenviar código"} if(AUTH.cool<=0)clearInterval(coolT)},1000)}
async function sendCode(){
  const email=AUTH.email.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){AUTH.msg="Escribe un email válido.";render();return}
  AUTH.busy=true;AUTH.msg="";render();
  try{
    const {data:ok,error:e1}=await SB.rpc("is_buyer",{p_email:email});
    if(e1) throw e1;
    if(!ok){AUTH.busy=false;AUTH.msg="No encontramos una compra con ese email. Usa el mismo email con el que pagaste.";render();return}
    const {error}=await SB.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
    if(error) throw error;
    AUTH.email=email;AUTH.step="code";AUTH.busy=false;AUTH.msg="";startCool();render();
  }catch(e){AUTH.busy=false;AUTH.msg=/rate|security purposes|seconds/i.test(e.message||"")?"Espera un minuto antes de pedir otro código.":"No pudimos enviar el código. Intenta de nuevo en un momento.";render()}
}
function bindLogin(){
  if(AUTH.step==="email"){const i=document.getElementById("em");i.oninput=()=>AUTH.email=i.value;i.onkeydown=e=>{if(e.key==="Enter")sendCode()};document.getElementById("go").onclick=sendCode;if(!AUTH.email)i.focus();return}
  const c=document.getElementById("code"); c.focus();
  const verify=async()=>{const token=c.value.replace(/\D/g,""); if(token.length<6){AUTH.msg="Escribe el código completo.";render();return}
    AUTH.busy=true;AUTH.msg="";render();
    const {data,error}=await SB.auth.verifyOtp({email:AUTH.email,token,type:"email"});
    if(error){AUTH.busy=false;AUTH.msg="Código incorrecto o vencido. Revisa el último email o pide uno nuevo.";render();return}
    USER=data.user; booting=true; render(); const ok=await pullRemote(); booting=false;
    if(!ok){await SB.auth.signOut();USER=null;AUTH={step:"email",email:AUTH.email,msg:"Tu email no tiene una compra activa. Si crees que es un error, escríbenos.",busy:false,cool:0}}
    AUTH.busy=false; render();};
  c.oninput=()=>{if(c.value.replace(/\D/g,"").length>=6)verify()};
  document.getElementById("ver").onclick=verify;
  document.getElementById("resend").onclick=()=>{AUTH.step="email";sendCode()};
  document.getElementById("chg").onclick=e=>{e.preventDefault();AUTH.step="email";AUTH.msg="";render()};
}

}
function bindNotice(){ root.querySelectorAll("[data-notice-ok]").forEach(b=>b.onclick=()=>{S.noticeSeen=Date.now();save();render()}); }
function toast(msg,undo){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div"); t.className="toast"; t.innerHTML=`<span>${msg}</span>${undo?'<button>Deshacer</button>':""}`;
  document.body.appendChild(t);
  if(undo) t.querySelector("button").onclick=()=>{undo();t.remove()};
  setTimeout(()=>t.remove(),5000);
}
function quickMark(day){
  if(day>28||S.done[day]) return;
  S.done[day]=todayStr(); save(); render();
  toast(`✓ Día ${day} marcado como completado`,()=>{delete S.done[day];save();render()});
}
function backDay(){
  const days=Object.keys(S.done).map(Number); if(!days.length) return;
  const last=Math.max(...days), date=S.done[last], ci=S.checkins[last];
  delete S.done[last]; delete S.checkins[last]; save(); render();
  toast(`↩ Día ${last} desmarcado`,()=>{S.done[last]=date; if(ci)S.checkins[last]=ci; save(); render()});
}
let markArmed=0;
function askMark(day,btn){
  if(Date.now()-markArmed>4000){ markArmed=Date.now(); btn.textContent="Toca otra vez para confirmar ✓"; return; }

}

/* ---------- APRENDE ---------- */
function learnHTML(){
  return `<h1>Aprende</h1><p class="muted mt">Lecciones cortas para entender tu cuerpo. Menos de 2 minutos cada una.</p>
  <div class="ex-list">${LESSONS.map(l=>`<button class="lesson" data-lesson="${l.id}"><span class="ic">${l.ic}</span><span><div class="nm">${l.t}</div><div class="ds">${l.d}</div></span>${S.read.includes(l.id)?`<span class="read">✓</span>`:""}</button>`).join("")}</div>
  <div class="wk-title"><h3>Biblioteca de ejercicios</h3><span class="muted small">${Object.keys(EX).length}</span></div>
  <div class="ex-list">${Object.keys(EX).map(id=>`<button class="ex" data-ex="${id}"><img src="${IMG[EX[id].img]}" alt=""><span><div class="nm">${EX[id].name}</div><div class="tm">${fmt(EX[id].secs)} min</div></span></button>`).join("")}</div>`;
}
function lessonView(id){
  const l=LESSONS.find(x=>x.id===id);
  return {html:()=>shell(`<button class="icon-btn" id="bk">←</button><div class="article"><div style="font-size:44px;margin-top:16px">${l.ic}</div><h1 class="mt">${l.t}</h1>${l.body}</div><button class="btn mt2" id="ok">Entendido ✓</button><p class="disc">Contenido educativo. No reemplaza la consulta con un profesional de la salud.</p>`),
    bind:()=>{const mark=()=>{if(!S.read.includes(id)){S.read.push(id);save()}};document.getElementById("bk").onclick=()=>{mark();closeView()};document.getElementById("ok").onclick=()=>{mark();closeView()};bindCommon()}};
}

/* ---------- AJUSTES ---------- */
function settingsView(){
  return {html:()=>shell(`<button class="icon-btn" id="bk">←</button><h1 class="mt">Ajustes</h1>
    <div class="card mt">
      <div class="set-row"><span>Nombre</span><input id="nm" value="${esc(S.name)}" style="border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;width:150px"></div>
      <div class="set-row"><span>Minutos por día</span><select id="mins" style="border:1px solid var(--line);border-radius:10px;padding:8px;font-size:15px;font-family:inherit">${[5,7,10,15].map(m=>`<option ${S.mins===m?"selected":""} value="${m}">${m} min</option>`).join("")}</select></div>
      <div class="set-row"><span>Guía por voz<br><small class="muted" style="font-weight:500">Te dice cada ejercicio en voz alta</small></span><button class="toggle${S.voice?" on":""}" id="voice"></button></div>
    </div>
    <h3 class="mt2">Zonas prioritarias</h3>
    <div class="opts">${ZONES.map(z=>`<button class="opt${S.zones.includes(z.k)?" sel":""}" data-z="${z.k}"><span class="em">${z.e}</span><span>${z.t}</span><span class="chk">${S.zones.includes(z.k)?"✓":""}</span></button>`).join("")}</div>
    <h3 class="mt2">Instala la app en tu celular</h3>
    <div class="card mt small" style="line-height:1.6"><b>iPhone:</b> abre esta página en Safari → toca <b>Compartir</b> → <b>Agregar a pantalla de inicio</b>.<br><b>Android:</b> abre en Chrome → menú <b>⋮</b> → <b>Agregar a pantalla principal</b>.<br><span class="muted">${SB?"Tu progreso se guarda en tu cuenta.":"Tu progreso se guarda en este dispositivo y navegador."}</span></div>
    ${CONFIG.supportUrl?`<a class="btn ghost mt2" style="text-decoration:none" href="${CONFIG.supportUrl}">💬 Contactar soporte</a>`:""}
    ${USER?`<div class="card mt2 small" style="line-height:1.6">Sesión iniciada como <b>${esc(USER.email)}</b><br><span class="muted">Tu progreso se guarda en tu cuenta: puedes entrar desde cualquier celular.</span></div><button class="btn ghost mt" id="logout">Cerrar sesión</button>`:""}
    <button class="btn ghost mt" id="reset" style="color:var(--bad)">Reiniciar mi plan</button>
    <p class="disc">${CONFIG.brand} · Reset Linfático 28<br>Contenido educativo. No reemplaza la consulta, el diagnóstico ni el tratamiento de un profesional de la salud.</p>`),
  bind:()=>{
    document.getElementById("bk").onclick=closeView;
    document.getElementById("nm").onchange=e=>{const v=e.target.value.trim(); if(v){S.name=v;save()}};
    document.getElementById("mins").onchange=e=>{S.mins=+e.target.value;save()};
    document.getElementById("voice").onclick=e=>{S.voice=!S.voice;save();e.target.classList.toggle("on",S.voice)};
    root.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{const k=b.dataset.z; if(S.zones.includes(k)){if(S.zones.length>1)S.zones=S.zones.filter(x=>x!==k)}else S.zones.push(k); save(); render()});
    const lo=document.getElementById("logout"); if(lo) lo.onclick=async()=>{await pushRemote(); await SB.auth.signOut(); USER=null; try{localStorage.removeItem(KEY)}catch(e){} S=Object.assign({name:"",mins:7,zones:["piernas"],voice:true,started:null,done:{},checkins:{},read:[],unlocked:false,onboarded:false}); view=null; AUTH={step:"email",email:"",msg:"",busy:false,cool:0}; render(); };
    let armed=false; document.getElementById("reset").onclick=e=>{ if(!armed){armed=true;e.target.textContent="Toca otra vez para confirmar (se borra tu progreso)";return} S.done={};S.checkins={};S.started=todayStr();save();closeView(); };
  }};
}

/* ============================================================
   REPRODUCTOR DE RUTINA
   ============================================================ */
let P=null, wakeLock=null, actx=null;
function beep(f=880,d=.12){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.18,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d)}catch(e){}}
let esVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();esVoice=vs.find(v=>/es[-_](419|MX|US|CO|AR)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(t){if(!S.voice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=esVoice?esVoice.lang:"es-419";if(esVoice)u.voice=esVoice;u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
async function lock(){try{if("wakeLock" in navigator)wakeLock=await navigator.wakeLock.request("screen")}catch(e){}}
function unlock(){try{wakeLock&&wakeLock.release();wakeLock=null}catch(e){}}

function startPlayer(day){
  const r=routine(day);
  P={day,r,i:0,phase:"prep",left:5,paused:false,t:null};
  lock(); say(`Día ${day}. Vamos. Primer ejercicio: ${EX[r[0].id].name}.`);
  drawPlayer(); P.t=setInterval(tick,1000);
}
function tick(){
  if(!P||P.paused) return;
  P.left--;
  if(P.left<=3&&P.left>0) beep(660,.08);
  if(P.left<=0){
    if(P.phase==="prep"){P.phase="go";P.left=P.r[P.i].secs;beep(990,.25);say(EX[P.r[P.i].id].cues[0]);}
    else{ P.i++; if(P.i>=P.r.length){finishPlayer();return} P.phase="prep";P.left=6;beep(520,.2);say(`Bien. Ahora: ${EX[P.r[P.i].id].name}.`); }
    drawPlayer(); return;
  }
  // cambia la indicación a mitad del ejercicio
  if(P.phase==="go"){const e=EX[P.r[P.i].id], tot=P.r[P.i].secs, idx=Math.min(e.cues.length-1,Math.floor((tot-P.left)/(tot/e.cues.length))); if(idx!==P.cueIdx){P.cueIdx=idx; if(idx>0) say(e.cues[idx]);}}
  updateTimer();
}
function drawPlayer(){
  const x=P.r[P.i], e=EX[x.id], prep=P.phase==="prep";
  P.cueIdx=0;
  const tot=prep?6:x.secs;
  let el=document.querySelector(".player"); if(!el){el=document.createElement("div");el.className="player";document.body.appendChild(el)}
  el.className="player"+(prep?" prep":"");
  el.innerHTML=`<div class="top"><button class="icon-btn" id="px" aria-label="Salir">✕</button><div class="segs">${P.r.map((_,k)=>`<i class="${k<P.i?"d":k===P.i?"c":""}"></i>`).join("")}</div></div>
  <div class="body"><img class="art" src="${IMG[e.img]}" alt=""><div class="label">${prep?"Prepárate · siguiente":`Ejercicio ${P.i+1} de ${P.r.length}`}</div><div class="name">${e.name}</div><div class="cue" id="cue">${prep?e.cues[0]:e.cues.join(" ")}</div>
  <div class="timer"><svg width="118" height="118"><circle cx="59" cy="59" r="52" stroke="#DCE6EC" stroke-width="9" fill="none"/><circle id="ring" cx="59" cy="59" r="52" stroke="${prep?"#FF6F4F":"#1A8A9C"}" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><span id="tl"></span></div></div>
  <div class="ctrl"><button class="round" id="pv" aria-label="Anterior">⏮</button><button class="btn" id="pp">${P.paused?"▶ Continuar":"⏸ Pausa"}</button><button class="round" id="nx" aria-label="Siguiente">⏭</button></div>`;
  P.tot=tot; updateTimer();
  document.getElementById("px").onclick=()=>{ if(confirmExit()) stopPlayer(); };
  document.getElementById("pp").onclick=()=>{P.paused=!P.paused; if(P.paused){try{speechSynthesis.cancel()}catch(e){}} drawPlayerControls();};
  document.getElementById("nx").onclick=()=>{P.left=1;P.paused=false;tick()};
  document.getElementById("pv").onclick=()=>{if(P.i>0){P.i--;}P.phase="prep";P.left=4;P.paused=false;drawPlayer()};
}
let exitArmed=0;
function confirmExit(){ const b=document.getElementById("px"); if(Date.now()-exitArmed<3000) return true; exitArmed=Date.now(); b.textContent="¿Salir?"; b.style.width="auto"; b.style.padding="0 12px"; setTimeout(()=>{if(b.isConnected){b.textContent="✕";b.style.width="";b.style.padding=""}},3000); return false; }
function drawPlayerControls(){const b=document.getElementById("pp"); if(b) b.textContent=P.paused?"▶ Continuar":"⏸ Pausa";}
function updateTimer(){const tl=document.getElementById("tl"),ring=document.getElementById("ring"); if(!tl)return; tl.textContent=P.left>=60?fmt(P.left):P.left; ring.setAttribute("stroke-dashoffset",326.7*(1-P.left/P.tot));}
function stopPlayer(){clearInterval(P&&P.t);P=null;unlock();try{speechSynthesis.cancel()}catch(e){}const el=document.querySelector(".player");el&&el.remove();render()}
function finishPlayer(){
  clearInterval(P.t); const day=P.day; unlock(); completeDay(day,true);
}
function completeDay(day,fromPlayer){
  if(fromPlayer) beep(1046,.4);
  const first=!S.done[day]; S.done[day]=S.done[day]||todayStr(); save();
  say(first?`¡Excelente, ${S.name}! Completaste el día ${day}.`:"¡Muy bien! Rutina completada.");
  if(view) view=null;
  let el=document.querySelector(".player"); if(!el){el=document.createElement("div");document.body.appendChild(el)}
  const ci=S.checkins[day]||{pesadez:0,hinchazon:0,energia:0,sueno:0};
  const Q=[["pesadez","¿Qué tan pesadas sientes las piernas hoy?","Nada","Muchísimo",["😌","🙂","😐","😣","😫"]],["hinchazon","¿Cuánta hinchazón notas?","Nada","Mucha",["😌","🙂","😐","😣","😫"]],["energia","¿Cómo está tu energía?","Muy baja","Excelente",["🪫","😪","😐","🙂","⚡"]],["sueno","¿Cómo dormiste anoche?","Muy mal","Excelente",["😵","😪","😐","🙂","😴"]]];
  el.className="player"; el.style.overflow="auto";
  el.innerHTML=`<div class="body" style="justify-content:flex-start;padding-top:20px"><div class="confetti">🎉</div><h1 class="mt">¡Día ${day} completado!</h1><p class="muted mt">${doneCount()} de 28 días · racha de ${streak()} 🔥</p>
  <div class="card mt2" style="width:100%;text-align:left"><h3>Check-in rápido</h3><p class="muted small">Te ayuda a ver tu progreso semana a semana.</p>
  ${Q.map(([k,q,a,b,em])=>`<div class="ci-q">${q}</div><div class="scale5" data-k="${k}">${em.map((e,i)=>`<button class="${ci[k]===i+1?"sel":""}" data-v="${i+1}">${e}</button>`).join("")}</div><div class="ci-l"><span>${a}</span><span>${b}</span></div>`).join("")}</div>
  <button class="btn mt2" id="save" style="max-width:560px">Guardar y terminar</button><button class="btn ghost mt" id="skip" style="max-width:560px">Saltar</button></div>`;
  el.querySelectorAll(".scale5").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ci[g.dataset.k]=+b.dataset.v; g.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b));}));
  document.getElementById("save").onclick=()=>{ if(ci.pesadez&&ci.energia){S.checkins[day]=ci;save()} P=null; el.remove(); tab="hoy"; render(); };
  document.getElementById("skip").onclick=()=>{P=null;el.remove();tab="hoy";render()};
}

/* ============================================================
   INICIO
   ============================================================ */
(function(){ try{const q=new URLSearchParams(location.search).get("code"); if(q&&CONFIG.accessCode&&q.toUpperCase()===CONFIG.accessCode.toUpperCase()){S.unlocked=true;save()}}catch(e){} boot(); })();
</script>
